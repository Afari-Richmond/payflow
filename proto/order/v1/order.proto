syntax = "proto3";

// package order.v1 is the versioned contract for the Order Service.
// Breaking changes get a new version (v2), not edits here.
package order.v1;

option go_package = "github.com/Afari-Richmond/payflow/proto/order/v1;orderv1";

// OrderService is the gRPC contract exposed by order-service.
service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
}

message CreateOrderRequest {
  string email = 1;
  int64 amount_minor = 2;
  string currency = 3;
}

// Order is the wire representation of an order. AmountMinor is always
// an integer minor-currency-unit amount — never a float.
message Order {
  string id = 1;
  string email = 2;
  int64 amount_minor = 3;
  string currency = 4;
  string status = 5;
  string created_at = 6; // RFC3339
  string updated_at = 7; // RFC3339
}

message CreateOrderResponse {
  Order order = 1;
}
