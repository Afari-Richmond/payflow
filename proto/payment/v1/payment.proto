syntax = "proto3";

// package payment.v1 is the versioned contract for the Payment
// Service. Breaking changes get a new version (v2), not edits here.
package payment.v1;

option go_package = "github.com/Afari-Richmond/payflow/proto/payment/v1;paymentv1";

// PaymentService is the gRPC contract exposed by payment-service.
service PaymentService {
  // CreatePayment records a payment attempt for an order and
  // initializes it with the payment provider (Paystack). Returns the
  // persisted payment plus a one-time authorization URL the caller
  // should redirect the customer to.
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);

  // HandleWebhook verifies and processes a Paystack webhook delivery.
  // Callers (api-gateway) forward the raw HTTP request body and
  // signature header untouched — see ADR 002. A non-error response
  // means the event was handled or safely ignored and should be
  // acknowledged (HTTP 200) to Paystack; an error means reject.
  rpc HandleWebhook(HandleWebhookRequest) returns (HandleWebhookResponse);
}

message CreatePaymentRequest {
  string order_id = 1;
  string email = 2;
  int64 amount_minor = 3;
  string currency = 4;
}

// Payment is the wire representation of a payment. AmountMinor is
// always an integer minor-currency-unit amount — never a float.
message Payment {
  string id = 1;
  string order_id = 2;
  int64 amount_minor = 3;
  string currency = 4;
  string status = 5;
  string provider_reference = 6;
  string created_at = 7; // RFC3339
  string updated_at = 8; // RFC3339
}

message CreatePaymentResponse {
  Payment payment = 1;
  // authorization_url is the one-time URL to redirect the customer to
  // complete payment. Never persisted — not a fact about the payment,
  // just a transient client action.
  string authorization_url = 2;
}

message HandleWebhookRequest {
  bytes raw_body = 1;
  // signature is the raw value of Paystack's X-Paystack-Signature
  // header, unverified until this RPC verifies it.
  string signature = 2;
}

message HandleWebhookResponse {}
