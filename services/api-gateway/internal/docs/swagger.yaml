basePath: /
definitions:
  httpapi.CreateOrderRequest:
    properties:
      amount:
        example: 25000
        type: integer
      currency:
        example: GHS
        type: string
      email:
        example: customer@example.com
        type: string
    required:
    - amount
    - currency
    - email
    type: object
  httpapi.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  httpapi.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  httpapi.OrderResponse:
    properties:
      amount:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      email:
        type: string
      id:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: External-facing HTTP API for PayFlow. Translates client requests into
    internal gRPC calls.
  title: PayFlow API Gateway
  version: "0.1"
paths:
  /api/v1/orders:
    post:
      consumes:
      - application/json
      description: Creates a new order in PENDING_PAYMENT status. Payment is confirmed
        separately, server-side — never by this endpoint alone.
      parameters:
      - description: Order details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpapi.OrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Create an order
      tags:
      - orders
  /health:
    get:
      description: Reports whether the api-gateway process is up and serving requests.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.HealthResponse'
      summary: Health check
      tags:
      - health
swagger: "2.0"
